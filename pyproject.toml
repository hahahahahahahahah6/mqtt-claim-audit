[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mqtt-claim-audit"
version = "0.1.0"
description = "Offline documentation and messaging transport evidence audit"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
mqtt-claim-audit = "mqtt_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["mqtt_claim_audit*"]
